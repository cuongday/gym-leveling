# Gym Leveling — exercise library (DRAFT, chưa được PT duyệt).
# Format: see content/README.md. Every entry starts with reviewed: false.
# equipment "none" = no training equipment; a sturdy chair, wall, step or table at home is allowed
# and is mentioned in the description when needed.
version: 1
exercises:

  # ───────────────────────── LOWER BODY — bodyweight ─────────────────────────

  - id: sit_to_stand
    name: { vi: "Ngồi xuống đứng lên ghế", en: "Sit-to-stand" }
    description:
      vi: "Ngồi ở mép một chiếc ghế chắc chắn, hai bàn chân rộng bằng hông. Hơi đổ người về trước, dồn lực xuống gót chân để đứng thẳng lên, rồi từ từ ngồi xuống chạm ghế. Thở ra khi đứng lên, hít vào khi ngồi xuống."
      en: "Sit on the edge of a sturdy chair, feet hip-width apart. Lean slightly forward and push through your heels to stand tall, then lower slowly back to the chair. Exhale as you stand, inhale as you sit."
    cues:
      vi: ["Đầu gối hướng theo mũi chân", "Ngồi xuống chậm, không thả phịch", "Không dùng tay chống nếu không cần"]
      en: ["Knees track over your toes", "Sit down slowly, don't drop", "Avoid pushing off with your hands unless needed"]
    safety:
      vi: "Dùng ghế không có bánh xe, kê sát tường; người hay chóng mặt nên đứng dậy chậm."
      en: "Use a chair without wheels, placed against a wall; stand up slowly if you get dizzy."
    muscle_groups: [quads, glutes]
    equipment: [none]
    difficulty: 1
    measure: reps
    easier: null
    harder: squat_bodyweight
    media: { youtube_query: "sit to stand exercise chair proper form" }
    reviewed: false

  - id: wall_sit
    name: { vi: "Wall sit (ngồi dựa tường)", en: "Wall sit" }
    description:
      vi: "Dựa lưng vào tường, trượt người xuống đến khi đùi gần song song sàn hoặc cao hơn nếu thấy khó. Giữ yên tư thế trong thời gian quy định. Thở đều, không nín thở."
      en: "Lean your back against a wall and slide down until your thighs are close to parallel, or higher if that is too hard. Hold the position for the set time. Breathe steadily; don't hold your breath."
    cues:
      vi: ["Lưng và đầu áp sát tường", "Đầu gối không vượt quá mũi chân nhiều", "Chọn độ sâu vừa sức"]
      en: ["Back and head against the wall", "Knees roughly above the ankles", "Pick a depth you can hold"]
    safety:
      vi: "Người đau gối hoặc cao huyết áp nên ngồi cao hơn và giữ ngắn; dừng nếu đau khớp gối."
      en: "With knee pain or high blood pressure, sit higher and hold shorter; stop if your knee hurts."
    muscle_groups: [quads, glutes]
    equipment: [none]
    difficulty: 1
    measure: time
    easier: null
    harder: null
    media: { youtube_query: "wall sit proper form beginner" }
    reviewed: false

  - id: squat_bodyweight
    name: { vi: "Squat", en: "Bodyweight squat" }
    description:
      vi: "Đứng hai chân rộng bằng vai, mũi chân hơi mở ra. Đẩy hông ra sau và gập gối để hạ người như ngồi xuống ghế, rồi đạp gót đứng lên. Hít vào khi xuống, thở ra khi lên."
      en: "Stand with feet shoulder-width apart, toes slightly out. Push your hips back and bend your knees as if sitting into a chair, then drive through your heels to stand. Inhale on the way down, exhale on the way up."
    cues:
      vi: ["Ngực mở, lưng thẳng", "Gót chân bám sàn", "Đầu gối mở theo hướng mũi chân"]
      en: ["Chest up, back neutral", "Heels stay down", "Knees follow your toes"]
    safety:
      vi: "Lỗi hay gặp là đầu gối chụm vào trong; chỉ xuống sâu đến mức không đau và không gù lưng."
      en: "Common mistake: knees caving in. Only go as deep as you can without pain or rounding your back."
    muscle_groups: [quads, glutes]
    equipment: [none]
    difficulty: 1
    measure: reps
    easier: sit_to_stand
    harder: split_squat_bodyweight
    media: { youtube_query: "bodyweight squat proper form" }
    reviewed: false

  - id: split_squat_bodyweight
    name: { vi: "Split squat", en: "Split squat" }
    description:
      vi: "Đứng tư thế chân trước chân sau, hai chân cách nhau khoảng một bước dài. Hạ thẳng người xuống đến khi gối sau gần chạm sàn, rồi đẩy chân trước để lên. Làm đủ số lần một bên rồi đổi chân."
      en: "Stand in a split stance, feet about one long stride apart. Lower straight down until the back knee nearly touches the floor, then push through the front foot to rise. Finish all reps on one side, then switch."
    cues:
      vi: ["Thân người thẳng đứng", "Trọng tâm dồn chân trước", "Có thể vịn tường để giữ thăng bằng"]
      en: ["Torso upright", "Weight mostly on the front foot", "Hold a wall for balance if needed"]
    safety:
      vi: "Người yếu thăng bằng nên vịn tường; đặt khăn dưới gối sau nếu sàn cứng."
      en: "If your balance is weak, hold a wall; put a towel under the back knee on hard floors."
    muscle_groups: [quads, glutes]
    equipment: [none]
    difficulty: 2
    measure: reps_per_side
    easier: squat_bodyweight
    harder: reverse_lunge_bodyweight
    media: { youtube_query: "bodyweight split squat form" }
    reviewed: false

  - id: reverse_lunge_bodyweight
    name: { vi: "Lunge lùi", en: "Reverse lunge" }
    description:
      vi: "Đứng thẳng, bước một chân lùi ra sau và hạ người đến khi hai gối gập khoảng 90 độ. Đạp chân trước để đưa chân sau về vị trí đứng. Đổi bên hoặc làm hết một bên theo quy định."
      en: "Stand tall, step one foot back and lower until both knees bend to about 90 degrees. Push through the front foot to bring the back leg home. Alternate or finish one side as prescribed."
    cues:
      vi: ["Bước lùi đủ dài", "Gối trước không đổ vào trong", "Giữ thân người vững"]
      en: ["Step back far enough", "Front knee doesn't cave in", "Keep your torso steady"]
    safety:
      vi: "Dễ đau gối hơn squat nếu bước quá ngắn; quay lại Split squat nếu mất thăng bằng."
      en: "Short steps load the knee more; go back to split squats if you lose balance."
    muscle_groups: [quads, glutes, hamstrings]
    equipment: [none]
    difficulty: 3
    measure: reps_per_side
    easier: split_squat_bodyweight
    harder: bulgarian_split_squat_bodyweight
    media: { youtube_query: "reverse lunge proper form" }
    reviewed: false

  - id: bulgarian_split_squat_bodyweight
    name: { vi: "Bulgarian split squat", en: "Bulgarian split squat" }
    description:
      vi: "Đặt mu bàn chân sau lên một chiếc ghế chắc chắn, chân trước bước xa ra. Hạ người thẳng xuống đến khi đùi trước gần song song sàn, rồi đẩy lên. Làm hết một bên rồi đổi chân."
      en: "Rest the top of your back foot on a sturdy chair and step the front foot well forward. Lower straight down until the front thigh is near parallel, then push up. Finish one side, then switch."
    cues:
      vi: ["Phần lớn trọng lượng ở chân trước", "Hông vuông về phía trước", "Xuống có kiểm soát"]
      en: ["Most weight on the front leg", "Hips square to the front", "Control the descent"]
    safety:
      vi: "Bài đòi hỏi thăng bằng tốt; ghế phải không trượt, người đau gối nên giảm biên độ."
      en: "Needs good balance; the chair must not slide. Reduce range if your knee is sore."
    muscle_groups: [quads, glutes]
    equipment: [none]
    difficulty: 4
    measure: reps_per_side
    easier: reverse_lunge_bodyweight
    harder: bulgarian_split_squat_dumbbell
    media: { youtube_query: "bulgarian split squat bodyweight form" }
    reviewed: false

  - id: step_up_bodyweight
    name: { vi: "Bước lên bục", en: "Step-up" }
    description:
      vi: "Đứng trước một bậc cầu thang hoặc bục chắc chắn cao khoảng tới giữa ống chân. Đặt cả bàn chân lên bục, đạp chân đó để đứng thẳng lên, rồi bước xuống có kiểm soát. Làm hết một bên rồi đổi chân."
      en: "Face a stair or sturdy step about mid-shin high. Place your whole foot on it, drive through that leg to stand up, then step down under control. Finish one side, then switch."
    cues:
      vi: ["Cả bàn chân đặt trên bục", "Dùng chân trên bục để đẩy, không bật chân dưới", "Vịn tay vịn nếu cần"]
      en: ["Whole foot on the step", "Push with the top leg, don't bounce off the bottom one", "Use a handrail if needed"]
    safety:
      vi: "Chọn bục thấp khi mới tập; không dùng ghế nhựa hay bề mặt trơn."
      en: "Start with a low step; never use plastic chairs or slippery surfaces."
    muscle_groups: [quads, glutes]
    equipment: [none]
    difficulty: 2
    measure: reps_per_side
    easier: sit_to_stand
    harder: reverse_lunge_bodyweight
    media: { youtube_query: "step up exercise proper form" }
    reviewed: false

  - id: hip_hinge_bodyweight
    name: { vi: "Gập hông (hip hinge)", en: "Bodyweight hip hinge" }
    description:
      vi: "Đứng hai chân rộng bằng hông, gối hơi chùng, hai tay đặt lên hông. Đẩy mông ra sau và cúi thân về trước với lưng thẳng đến khi thấy căng sau đùi, rồi siết mông đứng thẳng lại. Thở ra khi đứng lên."
      en: "Stand feet hip-width, knees soft, hands on hips. Push your hips back and tip your torso forward with a flat back until you feel your hamstrings stretch, then squeeze your glutes to stand. Exhale as you rise."
    cues:
      vi: ["Lưng luôn thẳng", "Chuyển động ở hông, không phải ở lưng", "Đầu nhìn theo thân người"]
      en: ["Back stays flat", "Move at the hips, not the spine", "Keep your neck in line"]
    safety:
      vi: "Người đau lưng chỉ cúi ở biên độ không đau; đây là bài học kỹ thuật trước khi tập RDL."
      en: "With back pain, use only a pain-free range; this teaches the pattern before RDLs."
    muscle_groups: [hamstrings, glutes]
    equipment: [none]
    difficulty: 1
    measure: reps
    easier: null
    harder: single_leg_rdl_bodyweight
    media: { youtube_query: "hip hinge drill bodyweight" }
    reviewed: false

  - id: single_leg_rdl_bodyweight
    name: { vi: "RDL một chân", en: "Single-leg Romanian deadlift" }
    description:
      vi: "Đứng trên một chân, gối hơi chùng. Gập hông cúi người về trước, chân kia duỗi thẳng ra sau thành một đường với thân, rồi siết mông trở về. Làm hết một bên rồi đổi chân."
      en: "Stand on one leg with a soft knee. Hinge forward while the free leg extends behind you in line with your torso, then squeeze your glutes to return. Finish one side, then switch."
    cues:
      vi: ["Hông giữ ngang, không xoay", "Lưng thẳng", "Chạm nhẹ tay vào tường để giữ thăng bằng"]
      en: ["Keep hips level, don't rotate", "Flat back", "Lightly touch a wall for balance"]
    safety:
      vi: "Dễ mất thăng bằng; tập gần tường và giảm biên độ nếu thấy căng lưng dưới."
      en: "Balance-demanding; train near a wall and shorten the range if your lower back tightens."
    muscle_groups: [hamstrings, glutes, core]
    equipment: [none]
    difficulty: 3
    measure: reps_per_side
    easier: hip_hinge_bodyweight
    harder: null
    media: { youtube_query: "single leg romanian deadlift bodyweight form" }
    reviewed: false

  - id: glute_bridge
    name: { vi: "Glute bridge", en: "Glute bridge" }
    description:
      vi: "Nằm ngửa, gập gối, bàn chân đặt trên sàn rộng bằng hông. Siết mông đẩy hông lên đến khi thân và đùi thành một đường thẳng, giữ 1 giây rồi hạ xuống. Thở ra khi đẩy lên."
      en: "Lie on your back, knees bent, feet flat and hip-width. Squeeze your glutes to lift your hips until your torso and thighs form a straight line, pause one second, then lower. Exhale as you lift."
    cues:
      vi: ["Đẩy bằng gót chân", "Siết mông ở điểm cao nhất", "Không ưỡn lưng quá mức"]
      en: ["Drive through your heels", "Squeeze glutes at the top", "Don't over-arch your lower back"]
    safety:
      vi: "Phụ nữ mang thai từ tam cá nguyệt thứ hai nên tránh nằm ngửa lâu; hỏi bác sĩ trước."
      en: "From the second trimester of pregnancy, avoid long periods lying on your back; check with a doctor."
    muscle_groups: [glutes, hamstrings]
    equipment: [mat]
    difficulty: 1
    measure: reps
    easier: null
    harder: single_leg_glute_bridge
    media: { youtube_query: "glute bridge proper form" }
    reviewed: false

  - id: single_leg_glute_bridge
    name: { vi: "Glute bridge một chân", en: "Single-leg glute bridge" }
    description:
      vi: "Nằm ngửa như Glute bridge, duỗi thẳng một chân lên. Đạp gót chân còn lại để đẩy hông lên, giữ hông ngang, rồi hạ xuống. Làm hết một bên rồi đổi chân."
      en: "Set up like a glute bridge and extend one leg. Push through the planted heel to lift your hips, keeping them level, then lower. Finish one side, then switch."
    cues:
      vi: ["Hai bên hông ngang nhau", "Siết mông, không đẩy bằng lưng", "Lên xuống chậm"]
      en: ["Hips stay level", "Use glutes, not your lower back", "Move slowly"]
    safety:
      vi: "Nếu chuột rút sau đùi, đặt bàn chân gần mông hơn và quay lại bài hai chân."
      en: "If your hamstring cramps, bring the foot closer and go back to the two-leg version."
    muscle_groups: [glutes, hamstrings]
    equipment: [mat]
    difficulty: 3
    measure: reps_per_side
    easier: glute_bridge
    harder: null
    media: { youtube_query: "single leg glute bridge form" }
    reviewed: false

  - id: calf_raise_bodyweight
    name: { vi: "Nhón gót", en: "Calf raise" }
    description:
      vi: "Đứng thẳng, tay vịn nhẹ vào tường hoặc ghế. Nhón gót lên cao hết mức, giữ 1 giây rồi hạ chậm xuống. Thở đều trong suốt bài."
      en: "Stand tall with a hand lightly on a wall or chair. Rise onto the balls of your feet as high as you can, pause one second, then lower slowly. Breathe steadily."
    cues:
      vi: ["Lên hết biên độ", "Hạ chậm 2–3 giây", "Đầu gối thẳng nhưng không khoá cứng"]
      en: ["Full range up", "Lower over 2–3 seconds", "Knees straight but not locked"]
    safety:
      vi: "Người có vấn đề gân Achilles nên tập biên độ nhỏ và tăng dần."
      en: "With Achilles problems, use a small range and build up gradually."
    muscle_groups: [calves]
    equipment: [none]
    difficulty: 1
    measure: reps
    easier: null
    harder: null
    media: { youtube_query: "standing calf raise proper form" }
    reviewed: false

  # ───────────────────────── LOWER BODY — dumbbell ─────────────────────────

  - id: goblet_squat
    name: { vi: "Goblet squat", en: "Goblet squat" }
    description:
      vi: "Hai tay ôm một quả tạ đơn dựng đứng trước ngực. Đẩy hông ra sau, gập gối hạ người xuống, giữ ngực mở, rồi đạp gót đứng lên. Hít vào khi xuống, thở ra khi lên."
      en: "Hold one dumbbell vertically against your chest. Push your hips back and bend your knees to lower, chest up, then drive through your heels to stand. Inhale down, exhale up."
    cues:
      vi: ["Tạ sát ngực", "Khuỷu tay hướng xuống giữa hai gối", "Gót chân không nhấc"]
      en: ["Weight tight to your chest", "Elbows point down between the knees", "Heels stay down"]
    safety:
      vi: "Chọn tạ nhẹ để giữ lưng thẳng; dừng nếu đau gối hoặc lưng dưới."
      en: "Pick a weight that lets you keep a flat back; stop if your knees or lower back hurt."
    muscle_groups: [quads, glutes, core]
    equipment: [dumbbell]
    difficulty: 2
    measure: reps
    easier: squat_bodyweight
    harder: split_squat_dumbbell
    media: { youtube_query: "goblet squat dumbbell proper form" }
    reviewed: false

  - id: split_squat_dumbbell
    name: { vi: "Split squat với tạ đơn", en: "Dumbbell split squat" }
    description:
      vi: "Hai tay cầm hai quả tạ đơn buông dọc thân, đứng tư thế chân trước chân sau. Hạ người thẳng xuống đến khi gối sau gần chạm sàn rồi đẩy lên. Làm hết một bên rồi đổi chân."
      en: "Hold a dumbbell in each hand at your sides in a split stance. Lower straight down until the back knee nearly touches the floor, then push up. Finish one side, then switch."
    cues:
      vi: ["Thân thẳng đứng", "Vai thả lỏng, không nhún", "Đẩy bằng chân trước"]
      en: ["Upright torso", "Shoulders relaxed, not shrugged", "Drive through the front foot"]
    safety:
      vi: "Nếu mất thăng bằng, dùng một tạ và tay kia vịn tường."
      en: "If balance is an issue, hold one dumbbell and keep the other hand on a wall."
    muscle_groups: [quads, glutes]
    equipment: [dumbbell]
    difficulty: 3
    measure: reps_per_side
    easier: split_squat_bodyweight
    harder: bulgarian_split_squat_dumbbell
    media: { youtube_query: "dumbbell split squat form" }
    reviewed: false

  - id: bulgarian_split_squat_dumbbell
    name: { vi: "Bulgarian split squat với tạ đơn", en: "Dumbbell Bulgarian split squat" }
    description:
      vi: "Cầm hai tạ đơn, đặt mu bàn chân sau lên ghế hoặc ghế tập chắc chắn. Hạ người thẳng xuống đến khi đùi trước gần song song sàn rồi đẩy lên. Làm hết một bên rồi đổi chân."
      en: "Hold two dumbbells and rest your back foot on a sturdy chair or bench. Lower until the front thigh is near parallel, then push up. Finish one side, then switch."
    cues:
      vi: ["Chân trước đủ xa ghế", "Thân hơi đổ về trước là bình thường", "Kiểm soát nhịp xuống"]
      en: ["Front foot far enough from the bench", "A slight forward lean is fine", "Control the way down"]
    safety:
      vi: "Thành thạo bản không tạ trước; tạ nặng làm tăng nguy cơ ngã."
      en: "Master the bodyweight version first; heavy weights raise the risk of falling."
    muscle_groups: [quads, glutes]
    equipment: [dumbbell]
    difficulty: 4
    measure: reps_per_side
    easier: split_squat_dumbbell
    harder: null
    media: { youtube_query: "dumbbell bulgarian split squat form" }
    reviewed: false

  - id: rdl_dumbbell
    name: { vi: "Romanian deadlift tạ đơn (RDL)", en: "Dumbbell Romanian deadlift" }
    description:
      vi: "Đứng cầm hai tạ đơn trước đùi, gối hơi chùng. Đẩy hông ra sau, trượt tạ dọc theo chân xuống đến khoảng giữa ống chân với lưng thẳng, rồi siết mông đứng lên. Hít vào khi xuống, thở ra khi lên."
      en: "Stand holding two dumbbells in front of your thighs, knees soft. Push your hips back and slide the weights down your legs to about mid-shin with a flat back, then squeeze your glutes to stand. Inhale down, exhale up."
    cues:
      vi: ["Tạ đi sát chân", "Lưng thẳng suốt bài", "Dừng khi thấy căng sau đùi"]
      en: ["Keep the weights close to your legs", "Flat back throughout", "Stop when your hamstrings are stretched"]
    safety:
      vi: "Lỗi hay gặp là gù lưng khi hạ thấp; người đau lưng nên học Gập hông trước."
      en: "Common mistake: rounding the back at the bottom. With back pain, learn the hip hinge first."
    muscle_groups: [hamstrings, glutes, back]
    equipment: [dumbbell]
    difficulty: 3
    measure: reps
    easier: hip_hinge_bodyweight
    harder: rdl_barbell
    media: { youtube_query: "dumbbell romanian deadlift proper form" }
    reviewed: false

  - id: glute_bridge_dumbbell
    name: { vi: "Glute bridge với tạ đơn", en: "Dumbbell glute bridge" }
    description:
      vi: "Nằm ngửa, gập gối, đặt một quả tạ đơn trên hông và giữ bằng hai tay. Siết mông đẩy hông lên đến khi thân và đùi thẳng hàng, giữ 1 giây rồi hạ xuống. Thở ra khi đẩy lên."
      en: "Lie on your back with knees bent and one dumbbell resting across your hips, held with both hands. Squeeze your glutes to lift until torso and thighs line up, pause, then lower. Exhale as you lift."
    cues:
      vi: ["Giữ tạ chắc trên xương hông", "Đẩy bằng gót", "Không ưỡn lưng"]
      en: ["Hold the weight steady on your hip bones", "Drive through your heels", "Don't arch your back"]
    safety:
